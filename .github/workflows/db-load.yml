name: Load player database into Supabase

# Carga supabase/schema.sql + supabase/seed.sql (generado por tools/db/build.py)
# usando el secreto del repo SUPABASE_DB_URL (URI del Session pooler).
on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
  workflow_dispatch:

concurrency:
  group: supabase-load
  cancel-in-progress: false

jobs:
  load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Apply schema and seed
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          test -n "$SUPABASE_DB_URL" || { echo "Falta el secreto SUPABASE_DB_URL"; exit 1; }
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q -f supabase/schema.sql
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q -f supabase/seed.sql
          psql "$SUPABASE_DB_URL" -At -c "select 'characters', count(*) from public.characters union all select 'cards', count(*) from public.cards union all select 'techniques', count(*) from public.techniques union all select 'card_techniques', count(*) from public.card_techniques"
